<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>📝 Editor | GD with GD Classroom</title>
	<meta name="robots" content="noindex">
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
	<link rel="stylesheet" href="/style.css">
	<link rel="stylesheet" href="editor.css">
</head>
<body>
	<div class="editor" id="editor" data-sidebar="0">
		<nav class="editor-sidebar" id="sidebar">
			<div class="editor-sidebar-content">
				<button class="editor-sidebar-close" id="sidebar-close"><span>❌</span> <span>hide</span></button>
				<header class="editor-sidebar-header">
					<p class="editor-sidebar-header-title"><a href="/">🍎&nbsp;&nbsp;gd with gd classroom</a></p>
				</header>
				<div class="editor-sidebar-list" id="sidebar-list"></div>
				<footer class="editor-sidebar-footer">
					<button class="editor-file-button" id="new-draft"><span>📄</span> <span>draft</span></button>
					<button class="editor-file-button" id="new-course"><span>🎓</span> <span>course</span></button>
					<button class="editor-file-button" id="reload"><span>🔄</span> <span>reload</span></button>
				</footer>
			</div>
		</nav>

		<section class="editor-source">
			<header class="editor-source-header">
				<label class="editor-filename">
					<input type="text" id="filename" value="untitled" spellcheck="false" autocomplete="off">
					<span>.md</span>
				</label>
				<span class="editor-source-file" id="source" hidden>
					<span class="editor-source-file-path" id="source-path"></span>
					<button type="button" class="editor-source-file-detach" id="source-detach" title="Stop saving to this file" aria-label="Stop saving to this file">✕</button>
				</span>
				<button class="editor-file-button" id="save" hidden><span>💾</span> <span>save</span></button>
				<button class="editor-file-button" id="media" hidden><span>🖼️</span> <span>media</span></button>
				<input type="file" id="media-file" accept="image/*,video/*,audio/*,.pdf" multiple hidden>
				<button class="editor-toggle editor-sidebar-toggle" id="toggle-sidebar" aria-pressed="false" hidden><span>🗂️</span> <span>all files</span></button>
				<button class="editor-toggle" id="toggle-toolbar" aria-expanded="true"><span>✍️</span> <span>shortcodes</span></button>
				<button class="editor-toggle" id="toggle-spellcheck" aria-pressed="false"><span>🔠</span> <span>spellcheck</span></button>
				<button class="editor-toggle" id="toggle-pause" aria-pressed="false"><span>⏸️</span> <span>pause</span></button>
			</header>

			<div class="editor-toolbar" id="toolbar"></div>

			<div class="editor-input" id="input"></div>

			<footer class="editor-source-footer">
				<label class="editor-fontsize" title="Type size">
					<span>size</span>
					<input type="range" id="fontsize" min="11" max="24" step="1" value="14" aria-label="Type size">
				</label>
				<span class="editor-status" id="status"></span>
			</footer>
		</section>

		<div class="editor-divider" id="divider" role="separator" aria-label="Resize panes" tabindex="0"></div>

		<section class="editor-preview">
			<iframe class="editor-frame" id="frame" title="Preview"></iframe>
			<div class="editor-tools">
				<button class="resource-menu-control" id="present" aria-label="Present">
					<svg class="resource-menu-control-text" viewBox="0 0 100 100"><defs><path id="editor-tool-present" d="M 50, 50 m -37, 0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0"></path></defs><text><textPath xlink:href="#editor-tool-present">present</textPath></text></svg>
					<div class="resource-menu-control-icon"><p>📺</p></div>
				</button>
				<button class="resource-menu-control" id="print" aria-label="Print">
					<svg class="resource-menu-control-text" viewBox="0 0 100 100"><defs><path id="editor-tool-print" d="M 50, 50 m -37, 0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0"></path></defs><text><textPath xlink:href="#editor-tool-print">print</textPath></text></svg>
					<div class="resource-menu-control-icon"><p>🖨️</p></div>
				</button>
			</div>
		</section>
	</div>

	<!-- one dialog for every form: the fields are built from whatever is being edited -->
	<dialog class="editor-dialog" id="form">
		<form class="editor-dialog-inner" id="form-inner" method="dialog">
			<header class="editor-dialog-header">
				<h2 class="editor-dialog-title" id="form-title"></h2>
				<button type="button" class="editor-file-button" id="form-close"><span>❌</span> <span>close</span></button>
			</header>
			<div class="editor-dialog-list" id="form-fields"></div>
			<footer class="editor-dialog-footer">
				<button type="submit" class="editor-file-button" id="form-save"><span>💾</span> <span>save</span></button>
				<span class="editor-dialog-note" id="form-note"></span>
			</footer>
		</form>
	</dialog>

	<script src="/assets/scripts/generate.js"></script>
	<script src="/assets/scripts/codemirror.js"></script>
	<script src="/assets/scripts/editor.js"></script>
	<script src="/assets/scripts/manager.js"></script>
</body>
</html>
